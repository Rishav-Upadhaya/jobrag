[project]
name = "jobrag"
version = "0.1.0"
description = "Hybrid-retrieval RAG for job search: LangGraph, pgvector + Postgres full-text, RRF, LLM judge."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "fastapi>=0.136.1",
    "langchain>=1.2.18",
    "langchain-community>=0.4.1",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=4.2.2",
    "langchain-openai>=1.2.1",
    "langchain-text-splitters>=0.3.0",
    "langgraph>=1.1.10",
    "langsmith>=0.8.3",
    # LlamaCloud — vector indexing, embedding, semantic search, parsing
    "llama-cloud",
    "llama-parse>=0.6.94",
    "llama-index-core>=0.12.0",
    "llama-index-readers-file>=0.6.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3,<3",
    "pgvector>=0.4.2",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.28",
    "sentence-transformers>=3.3.1",
    "uvicorn[standard]>=0.46.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
